spring.application.name=pet-app

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/pet_app_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Facebook Graph API Configuration
facebook.graph.api.base-url=https://graph.facebook.com/v21.0
facebook.graph.api.page-id=${FACEBOOK_PAGE_ID}
facebook.graph.api.page-access-token=${FACEBOOK_PAGE_ACCESS_TOKEN}
facebook.graph.api.fields=attachments
facebook.graph.api.limit=50

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false
